[build-system]
requires = ["setuptools>=45", "wheel", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-strategy-trading"
version = "0.1.0"
description = "Professional quantitative trading platform with visual strategy orchestration"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["trading", "quantitative", "algorithmic", "forex", "crypto", "cfds", "multi-asset", "api"]
authors = [
    { name = "Developer" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "structlog>=23.0.0",
    "python-json-logger>=2.0.0",
    "networkx>=3.0.0",
    "python-dateutil>=2.8.0",
    "httpx>=0.24.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]
backtest = [
    "pyarrow>=18.0.0",
]
ml = [
    "scikit-learn>=1.5.0",
]
viz = [
    "matplotlib>=3.9.0",
    "mplfinance>=0.12.0",
]
all = [
    "intelligent-strategy-trading[dev,backtest,ml,viz]"
]

[project.urls]
Documentation = "https://github.com/yourusername/intelligent-strategy-trading#readme"
Issues = "https://github.com/yourusername/intelligent-strategy-trading/issues"
Source = "https://github.com/yourusername/intelligent-strategy-trading"

[project.scripts]
ist = "ist.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
