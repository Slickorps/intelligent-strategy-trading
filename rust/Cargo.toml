[package]
name = "ist-rust-engine"
version = "0.1.0"
edition = "2021"
description = "High-performance data processing engine for Intelligent Strategy Trading"

[lib]
name = "_rust_engine"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
ndarray = "0.15"
numpy = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1