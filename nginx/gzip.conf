# Gzip compression settings
# Included from nginx.conf

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_disable "msie6";

# Compress these MIME types
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    text/csv
    application/json
    application/javascript
    application/xml
    application/rss+xml
    application/atom+xml
    application/x-javascript
    image/svg+xml
    image/x-icon
    font/opentype
    font/ttf
    application/font-woff
    application/font-woff2;

# Static file gzip cache
gzip_static on;

# Not used for proxied requests — handled via gzip_proxied
