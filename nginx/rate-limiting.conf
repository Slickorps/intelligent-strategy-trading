# Rate limiting configuration
# Included from nginx.conf

# Define rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=backtest_limit:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=ml_limit:10m rate=5r/s;

# Connection limiting
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Apply rate limits to specific endpoints
# Uncomment in server blocks:

# Global API rate limit — 30 requests/second per IP, burst 50
# limit_req zone=api_limit burst=50 nodelay;

# Backtest endpoints — heavier operations
# location /backtest {
#     limit_req zone=backtest_limit burst=5 nodelay;
# }

# ML factor endpoints — computationally intensive
# location /risk/ml-factors {
#     limit_req zone=ml_limit burst=5 nodelay;
# }

# Global connection limit — 50 concurrent connections per IP
# limit_conn conn_limit 50;
