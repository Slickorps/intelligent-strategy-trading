# Upstream load balancing configuration
# Included via nginx.conf or server blocks

# ─── API Backend ──────────────────────────────────────────────
# Already defined inline in nginx.conf with least_conn strategy.
# For advanced balancing, use the options below.

# Round-robin (default):
# upstream api_backend {
#     server api:8000;
#     server api2:8000;
# }

# IP hash (session persistence):
# upstream api_backend {
#     ip_hash;
#     server api:8000;
#     server api2:8000;
# }

# Weighted round-robin:
# upstream api_backend {
#     server api:8000 weight=3;
#     server api2:8000 weight=1;
# }

# Health check parameters:
#   max_fails=N     — failures before marking down
#   fail_timeout=T  — how long to wait before retrying
#   slow_start=T    — gradual traffic ramp-up (commercial nginx)
#   backup          — only used when all others are down
#   down            — permanently marked as unavailable
