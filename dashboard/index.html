<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IST — Real‑time Trading Dashboard</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
        Ubuntu, Cantarell, sans-serif;
      background: #131722;
      color: #d1d4dc;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ── header ────────────────────────────────────── */
    .header {
      background: #1e222d;
      border-bottom: 1px solid #2a2e39;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      color: #fff;
    }
    .header .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.875rem;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }
    .dot.green { background: #26a69a; }
    .dot.red   { background: #ef5350; }

    /* ── account cards ─────────────────────────────── */
    .account-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      padding: 20px 24px;
    }
    .card {
      background: #1e222d;
      border: 1px solid #2a2e39;
      border-radius: 8px;
      padding: 16px;
    }
    .card .label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: #787b86;
      margin-bottom: 6px;
    }
    .card .value {
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
    }
    .card .value.positive { color: #00bcd4; }
    .card .value.negative { color: #ef5350; }

    /* ── chart ─────────────────────────────────────── */
    .chart-section {
      padding: 0 24px 20px;
    }
    .chart-container {
      width: 100%;
      background: #1e222d;
      border: 1px solid #2a2e39;
      border-radius: 8px;
      overflow: hidden;
    }
    .chart-container canvas {
      display: block;
      width: 100%;
    }

    /* ── positions & orders table ──────────────────── */
    .data-section {
      padding: 0 24px 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 900px) {
      .data-section { grid-template-columns: 1fr; }
    }
    .table-card {
      background: #1e222d;
      border: 1px solid #2a2e39;
      border-radius: 8px;
      overflow: hidden;
    }
    .table-card h3 {
      padding: 12px 16px;
      font-size: 0.9rem;
      font-weight: 600;
      border-bottom: 1px solid #2a2e39;
      color: #fff;
    }
    .table-wrap {
      overflow-x: auto;
      max-height: 380px;
      overflow-y: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    th {
      text-align: left;
      padding: 8px 16px;
      color: #787b86;
      font-weight: 500;
      border-bottom: 1px solid #2a2e39;
      white-space: nowrap;
    }
    td {
      padding: 8px 16px;
      border-bottom: 1px solid #2a2e39;
      white-space: nowrap;
    }
    .positive { color: #00bcd4; }
    .negative { color: #ef5350; }
    .highlight { color: #ff9800; }

    /* ── footer ────────────────────────────────────── */
    .footer {
      margin-top: auto;
      padding: 10px 24px;
      font-size: 0.75rem;
      color: #5d606b;
      text-align: right;
      border-top: 1px solid #2a2e39;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <h1>📊 Intelligent Strategy Trading</h1>
    <div class="status">
      <span id="conn-label">Disconnected</span>
      <span class="dot red" id="conn-dot"></span>
    </div>
  </header>

  <!-- Account overview -->
  <section class="account-row" id="account-row">
    <div class="card">
      <p class="label">Balance</p>
      <p class="value" id="val-balance">—</p>
    </div>
    <div class="card">
      <p class="label">Equity</p>
      <p class="value" id="val-equity">—</p>
    </div>
    <div class="card">
      <p class="label">Margin</p>
      <p class="value" id="val-margin">—</p>
    </div>
    <div class="card">
      <p class="label">Free Margin</p>
      <p class="value" id="val-freemargin">—</p>
    </div>
    <div class="card">
      <p class="label">Daily P&L</p>
      <p class="value" id="val-dailypnl">—</p>
    </div>
    <div class="card">
      <p class="label">Total P&L</p>
      <p class="value" id="val-totalpnl">—</p>
    </div>
  </section>

  <!-- Equity chart -->
  <section class="chart-section">
    <div class="chart-container" id="chart-container"></div>
  </section>

  <!-- Positions & Orders -->
  <section class="data-section">
    <div class="table-card">
      <h3>💰 Open Positions</h3>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Symbol</th><th>Side</th><th>Size</th>
              <th>Entry</th><th>Current</th><th>P&L</th><th>P&L%</th>
            </tr>
          </thead>
          <tbody id="positions-body">
            <tr><td colspan="7" style="text-align:center;color:#787b86">No positions</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="table-card">
      <h3>📋 Recent Orders</h3>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th><th>Symbol</th><th>Side</th><th>Type</th>
              <th>Size</th><th>Price</th><th>Status</th>
            </tr>
          </thead>
          <tbody id="orders-body">
            <tr><td colspan="7" style="text-align:center;color:#787b86">No orders</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>

  <footer class="footer">
    <span id="last-update">Last update: —</span>
  </footer>

  <script type="module">
    import { TradeService } from './src/trade-service.js';
    import { PnLChart } from './src/pnl-chart.js';

    const service = new TradeService('ws://localhost:8000/ws');
    const chart = new PnLChart(document.getElementById('chart-container'));

    // DOM refs
    const connDot = document.getElementById('conn-dot');
    const connLabel = document.getElementById('conn-label');
    const lastUpdateEl = document.getElementById('last-update');

    // Account values
    const el = (id) => document.getElementById(id);

    // ── subscribe to state ──────────────────────────────────
    service.subscribe((state) => {
      // Connection indicator
      if (state.connected) {
        connDot.className = 'dot green';
        connLabel.textContent = 'Connected';
      } else {
        connDot.className = 'dot red';
        connLabel.textContent = 'Disconnected';
      }

      // Timestamp
      lastUpdateEl.textContent = state.lastUpdate
        ? `Last update: ${new Date(state.lastUpdate).toLocaleTimeString()}`
        : 'Last update: —';

      // Account cards
      const acct = state.account ?? {};
      el('val-balance').textContent = formatCurrency(acct.balance);
      el('val-equity').textContent = formatCurrency(acct.equity);
      el('val-margin').textContent = formatCurrency(acct.margin);
      el('val-freemargin').textContent = formatCurrency(acct.freeMargin);

      const daily = acct.dailyPnl ?? 0;
      const total = acct.totalPnl ?? 0;
      const dEl = el('val-dailypnl');
      const tEl = el('val-totalpnl');
      dEl.textContent = formatPnl(daily);
      dEl.className = `value ${daily >= 0 ? 'positive' : 'negative'}`;
      tEl.textContent = formatPnl(total);
      tEl.className = `value ${total >= 0 ? 'positive' : 'negative'}`;

      // Positions table
      renderPositions(state.positions);

      // Orders table
      renderOrders(state.orders);

      // Chart — push equity value
      if (typeof acct.equity === 'number') {
        chart.push(acct.equity);
      }
    });

    // ── connect ─────────────────────────────────────────────
    service.connect();

    // ── helpers ─────────────────────────────────────────────
    function formatCurrency(v) {
      if (v === undefined || v === null) return '—';
      return '$' + Number(v).toLocaleString('en-US', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      });
    }

    function formatPnl(v) {
      if (v === undefined || v === null) return '—';
      const prefix = v >= 0 ? '+' : '';
      return prefix + formatCurrency(v);
    }

    function renderPositions(list) {
      const tbody = document.getElementById('positions-body');
      if (!list || list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#787b86">No open positions</td></tr>';
        return;
      }
      tbody.innerHTML = list.map((p) => `
        <tr>
          <td><strong>${esc(p.symbol)}</strong></td>
          <td class="${p.side === 'long' ? 'positive' : 'negative'}">${esc(p.side)}</td>
          <td>${esc(p.size)}</td>
          <td>${formatCurrency(p.entryPrice)}</td>
          <td>${formatCurrency(p.currentPrice)}</td>
          <td class="${p.unrealizedPnl >= 0 ? 'positive' : 'negative'}">${formatPnl(p.unrealizedPnl)}</td>
          <td class="${p.pnlPct >= 0 ? 'positive' : 'negative'}">${p.pnlPct != null ? p.pnlPct.toFixed(2) + '%' : '—'}</td>
        </tr>
      `).join('');
    }

    function renderOrders(list) {
      const tbody = document.getElementById('orders-body');
      if (!list || list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#787b86">No recent orders</td></tr>';
        return;
      }
      tbody.innerHTML = list.slice(0, 50).map((o) => `
        <tr>
          <td style="font-size:0.8rem;color:#787b86">${esc(o.id).slice(0, 8)}</td>
          <td><strong>${esc(o.symbol)}</strong></td>
          <td class="${o.side === 'buy' ? 'positive' : 'negative'}">${esc(o.side)}</td>
          <td>${esc(o.type)}</td>
          <td>${esc(o.size)}</td>
          <td>${o.price ? formatCurrency(o.price) : '—'}</td>
          <td class="${o.status === 'filled' ? 'positive' : o.status === 'rejected' ? 'negative' : 'highlight'}">${esc(o.status)}</td>
        </tr>
      `).join('');
    }

    function esc(s) {
      if (s == null) return '';
      return String(s).replace(/[&<>"]/g, (c) =>
        ({ '&': '&', '<': '<', '>': '>', '"': '"' })[c]
      );
    }
  </script>
</body>
</html>
